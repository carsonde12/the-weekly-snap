---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      Posted {{ page.date | date: "%B %-d, %Y" }}
      {% if page.categories.size > 0 %}
        in {% for cat in page.categories %}{{ cat | capitalize }}{% unless forloop.last %}, {% endunless %}{% endfor %}
      {% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
